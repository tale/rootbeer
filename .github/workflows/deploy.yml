name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.diff.outputs.source }}
      timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find published nightly source
        id: nightly
        shell: bash
        run: |
          sha="$(curl -fsSL https://rootbeer.tale.me/nightly/source-sha.txt || true)"

          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect source changes
        id: diff
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ steps.nightly.outputs.sha }}'

          if [[ -z "$base" ]]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" HEAD -- crates lua packages Cargo.toml Cargo.lock .github/workflows/deploy.yml; then
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate build timestamp
        id: timestamp
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.source == 'true'
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ contains(matrix.target, 'apple') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build
        run: |
          [[ "$ROOTBEER_INDEX_URL" == https://* ]] || { echo "ROOTBEER_INDEX_URL must configure the official index" >&2; exit 1; }
          [[ "$ROOTBEER_INDEX_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]] || { echo "ROOTBEER_INDEX_PUBLIC_KEY must configure its verification key" >&2; exit 1; }
          cargo build --locked --release --target ${{ matrix.target }}
        env:
          ROOTBEER_INDEX_URL: ${{ vars.ROOTBEER_INDEX_URL }}
          ROOTBEER_INDEX_PUBLIC_KEY: ${{ vars.ROOTBEER_INDEX_PUBLIC_KEY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          RB_BUILD_TIMESTAMP: ${{ needs.changes.outputs.timestamp }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rb-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/rb

  deploy:
    name: Deploy
    needs: [changes, build]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test catalog search
        run: pnpm test:catalog

      - name: Build site
        run: pnpm build
        env:
          ROOTBEER_INDEX_URL: ${{ vars.ROOTBEER_INDEX_URL }}
          ROOTBEER_INDEX_PUBLIC_KEY: ${{ vars.ROOTBEER_INDEX_PUBLIC_KEY }}

      - name: Download artifacts
        if: needs.changes.outputs.source == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Package nightly binaries
        if: needs.changes.outputs.source == 'true'
        run: |
          mkdir -p .vitepress/dist/nightly
          for name in linux-x86_64 linux-aarch64 macos-aarch64; do
            (cd "artifacts/rb-${name}" && zip "../../.vitepress/dist/nightly/rb-${name}.zip" rb)
          done
          echo '${{ needs.changes.outputs.timestamp }}' > .vitepress/dist/nightly/version.txt
          echo '${{ github.sha }}' > .vitepress/dist/nightly/source-sha.txt

      - name: Preserve existing nightly binaries
        if: needs.changes.outputs.source != 'true'
        run: |
          mkdir -p .vitepress/dist/nightly
          for name in linux-x86_64 linux-aarch64 macos-aarch64; do
            curl -fsSL "https://rootbeer.tale.me/nightly/rb-${name}.zip" \
              -o ".vitepress/dist/nightly/rb-${name}.zip" || true
          done
          curl -fsSL "https://rootbeer.tale.me/nightly/version.txt" \
            -o ".vitepress/dist/nightly/version.txt" || true
          curl -fsSL "https://rootbeer.tale.me/nightly/source-sha.txt" \
            -o ".vitepress/dist/nightly/source-sha.txt" || true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
