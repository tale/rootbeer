name: "Update flake.lock"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # weekly on Sunday at 00:00

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3

      - name: Update flake inputs
        run: nix flake update

      - name: Check flake
        run: nix flake check

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(nix): update `flake.lock`"
          commit-message: "chore(nix): update `flake.lock`"
          branch: update-flake-lock
          labels: |
            Dependencies
