name: Update Rootbeer package
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Request a Rootbeer update
        env:
          GH_TOKEN: ${{ secrets.INDEX_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Index polling will pick up this successful build; set INDEX_UPDATE_TOKEN for immediate dispatch."
            exit 0
          fi
          gh api --method POST repos/tale/rootbeer-index/dispatches -f event_type=rootbeer-update
