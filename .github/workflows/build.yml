name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-net --unshare-uts --die-with-parent --new-session --cap-drop ALL --ro-bind / / /bin/true

      - name: Test
        run: cargo test

      - name: Retain tested Forge binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir forge
          cp target/${{ matrix.target }}/release/rootbeer-forge forge/rootbeer-forge-${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: forge-${{ matrix.target }}
          path: forge/
          if-no-files-found: error

  forge:
    name: Publish Forge binaries
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forge-*
          path: forge
          merge-multiple: true
      - name: Attest tested binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: forge/*
          create-storage-record: false
      - name: Publish commit-pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="forge-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Forge release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" forge/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Forge $GITHUB_SHA" --prerelease --latest=false \
            --notes 'Tested Forge binaries for the pinned engine commit. Verify the GitHub build attestation before execution.'
