name: Update Rootbeer package
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: notify-pdr
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check notification credentials
        id: key
        env:
          ROOTBEER_BOT_CLIENT_ID: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
        run: |
          if [ -n "$ROOTBEER_BOT_CLIENT_ID" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'PDR polling will pick up this successful build.'
          fi
      - name: Mint a Rootbeer Bot token
        id: app
        if: steps.key.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
          owner: rootbeer-org
          repositories: pdr
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.available == 'true'
        with:
          repository: rootbeer-org/pdr
          ref: main
          token: ${{ steps.app.outputs.token }}
      - name: Request a Rootbeer update
        if: steps.key.outputs.available == 'true'
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            printf '%s\n' "$SOURCE_REVISION" > rootbeer-update
            git add rootbeer-update
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ci(rootbeer): request update'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
