name: Package catalog

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "lua/**"
      - ".github/workflows/packages.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "lua/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-cargo-${{ matrix.runner }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            package-cargo-${{ matrix.runner }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Test package engine
        run: cargo test --locked --workspace --quiet
      - name: Build packaging tool
        run: cargo build --locked --release --bin rootbeer-forge
      - name: Validate catalog
        run: target/release/rootbeer-forge check
      - name: Install and check package commands
        run: target/release/rootbeer-forge --catalog packages export --registry tale/rootbeer-index --output result --workers 2 --jobs 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
