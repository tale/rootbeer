name: Package catalog

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "lua/**"
      - ".github/workflows/packages.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "lua/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Test package engine
        run: cargo test --locked --workspace --quiet
      - name: Build standalone rb
        run: cargo build --locked --release --bin rb
      - name: Validate catalog
        run: target/release/rb package check
      - name: Install and check package commands
        run: target/release/rb package --catalog packages export --registry tale/rootbeer-index --output result
        env:
          GITHUB_TOKEN: ${{ github.token }}
