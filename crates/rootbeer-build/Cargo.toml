[package]
name = "rootbeer-build"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rootbeer-store = { path = "../rootbeer-store" }
rootbeer-package = { path = "../rootbeer-package" }
flate2 = "1"
tar = "0.4"
libc = "0.2.182"
